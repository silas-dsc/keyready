name: Refresh Open Banking data

# Pulls every lender's public home-loan product data (Consumer Data Right) weekly and
# commits the snapshot if rates or rules changed. The push then triggers the deploy workflow.
on:
  schedule:
    - cron: '17 19 * * 0' # Mondays ~6am AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:cdr
      - run: npm test
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/market.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/market.json
          git commit -m "Refresh Open Banking lender data"
          git push
