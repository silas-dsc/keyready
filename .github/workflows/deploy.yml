name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Commits pushed by the weekly data refresh use GITHUB_TOKEN, which doesn't trigger push workflows.
  workflow_run:
    workflows: [Refresh Open Banking data]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Per-branch group: a PR run must never cancel a main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The coverage report is posted as a comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests with coverage; fails if the engine or MCP server drop below the thresholds in vite.config.ts.
      - run: npm run test:coverage
      - name: Report coverage
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage/index.html') != ''
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      # Builds every site in src/sites/ (hub at keyready.au/, sub-sites at keyready.au/<id>/) from the shared engine.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
